<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Manic Miner Level + Robot Editor</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#111;color:#eee;font-family:monospace;font-size:13px;display:flex;flex-direction:column;height:100vh;overflow:hidden}
#toolbar{display:flex;align-items:center;gap:6px;padding:5px 10px;background:#1a1a1a;border-bottom:1px solid #333;flex-shrink:0;flex-wrap:wrap}
#toolbar label{color:#aaa;font-size:12px;display:flex;align-items:center;gap:4px}
#toolbar select,#toolbar input[type=text]{background:#2a2a2a;color:#eee;border:1px solid #444;padding:3px 6px;border-radius:3px;font-family:monospace;font-size:12px}
#toolbar input[type=text]{width:200px}
button{background:#2a4a2a;color:#cfc;border:1px solid #4a6a4a;padding:3px 8px;cursor:pointer;border-radius:3px;font-family:monospace;font-size:12px}
button:hover{background:#3a5a3a}
button.danger{background:#4a1a1a;color:#fcc;border-color:#6a3a3a}
button.danger:hover{background:#5a2a2a}
button.active{background:#4a3a00;border-color:#6a5a00;color:#fc0}
button.export{background:#002a4a;color:#adf;border-color:#004a6a}
button.export:hover{background:#003a5a}
#mode-btns{display:flex;gap:2px;background:#111;padding:2px;border-radius:4px;border:1px solid #333}
#mode-btns button{border-radius:3px;padding:2px 10px}
#main{display:flex;flex:1;overflow:hidden;min-height:0}
#left-panel{width:440px;flex-shrink:0;background:#181818;border-right:1px solid #333;display:flex;flex-direction:column;overflow:hidden}
h3{color:#666;font-size:10px;margin-bottom:5px;text-transform:uppercase;letter-spacing:1px}
/* Tile mode */
#tile-ui{display:flex;flex-direction:column;flex:1;overflow:hidden;min-height:0}
#robot-ui{display:flex;flex-direction:row;flex:1;overflow:hidden;min-height:0}
#robot-col{width:290px;flex-shrink:0;display:flex;flex-direction:column;overflow:hidden;border-right:1px solid #333}
#portal-col{flex:1;display:flex;flex-direction:column;overflow-y:auto;padding:8px}
#palette-section{padding:8px;border-bottom:1px solid #333;flex-shrink:0}
#tile-palette{display:grid;grid-template-columns:repeat(5,1fr);gap:3px}
.palette-tile{cursor:pointer;border:2px solid #333;border-radius:3px;display:flex;flex-direction:column;align-items:center;padding:2px 1px;gap:1px}
.palette-tile:hover{border-color:#666}
.palette-tile.selected{border-color:#fc0;background:#221a00}
.palette-tile canvas{image-rendering:pixelated;width:38px;height:38px}
.palette-tile .tl{font-size:9px;color:#888;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;width:100%;text-align:center}
#tile-editor-section{padding:8px;border-bottom:1px solid #333;flex-shrink:0}
#te-wrap{display:flex;gap:8px;align-items:flex-start}
#pixel-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:1px;background:#2a2a2a;padding:2px;border:1px solid #555;flex-shrink:0}
.px{width:20px;height:20px;cursor:crosshair}
#tile-props{display:flex;flex-direction:column;gap:4px;flex:1;min-width:0}
#tile-props label{display:flex;flex-direction:column;gap:1px;font-size:11px;color:#999}
#tile-props label.row{flex-direction:row;align-items:center;gap:6px;cursor:pointer}
#tile-props select,#tile-props input{background:#2a2a2a;color:#eee;border:1px solid #444;padding:2px 4px;border-radius:2px;font-family:monospace;font-size:11px}
.ops{display:flex;gap:3px;flex-wrap:wrap;margin-top:3px}
.ops button{padding:1px 5px;font-size:11px;min-width:22px}
/* Robot mode */
#robot-list-section{padding:8px;border-bottom:1px solid #333;flex-shrink:0}
#robot-list{display:flex;flex-direction:column;gap:3px;max-height:160px;overflow-y:auto}
.robot-item{display:flex;align-items:center;gap:6px;padding:3px 6px;border:1px solid #333;border-radius:3px;cursor:pointer;font-size:11px}
.robot-item:hover{border-color:#555}
.robot-item.selected{border-color:#fc0;background:#221a00}
.robot-item .ri-sprite{image-rendering:pixelated;width:16px;height:16px;flex-shrink:0}
.robot-item .ri-info{flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;color:#bbb}
.robot-item .ri-del{color:#a44;cursor:pointer;font-size:14px;flex-shrink:0}
.robot-item .ri-del:hover{color:#f66}
#robot-add{margin-top:5px;display:flex;gap:4px}
#robot-props-section{padding:6px 8px 2px;overflow-y:auto}
#robot-props-section h3{margin-bottom:4px}
.rp-grid{display:grid;grid-template-columns:1fr 1fr;gap:4px 8px}
.rp-grid label{display:flex;flex-direction:column;gap:2px;font-size:11px;color:#999}
.rp-grid label.wide{grid-column:1/-1}
.rp-grid label.row{flex-direction:row;align-items:center;gap:6px;cursor:pointer;color:#eee}
.rp-grid select,.rp-grid input[type=number],.rp-grid input[type=text]{background:#2a2a2a;color:#eee;border:1px solid #444;padding:2px 4px;border-radius:2px;font-family:monospace;font-size:11px;width:100%}
#sprite-selector{padding:4px 8px 8px;border-top:1px solid #333}
#sprite-selector h3{margin-bottom:5px}
#sprite-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:3px;max-height:120px;overflow-y:auto}
.sprite-thumb{cursor:pointer;border:2px solid #333;border-radius:2px;display:flex;flex-direction:column;align-items:center;padding:1px}
.sprite-thumb:hover{border-color:#666}
.sprite-thumb.selected{border-color:#fc0;background:#221a00}
.sprite-thumb canvas{image-rendering:pixelated;width:24px;height:24px}
.sprite-thumb .si{font-size:8px;color:#666}
/* Shared */
#help{padding:8px;font-size:11px;color:#444;line-height:1.9}
#scroll-area{flex:1;overflow:auto;background:#0a0a0a;padding:10px}
#grid-container{display:inline-block;position:relative;line-height:0}
canvas{display:block;image-rendering:pixelated}
#oc{position:absolute;top:0;left:0;pointer-events:none}
#rc{position:absolute;top:0;left:0}
#status{background:#1a1a1a;border-top:1px solid #333;padding:3px 10px;font-size:11px;color:#666;flex-shrink:0}
select option{background:#222;color:#eee}
</style>
</head>
<body>
<div id="toolbar">
  <label>Level</label>
  <select id="lsel" style="width:210px"></select>
  <button id="btn-new">+ New</button>
  <button id="btn-clone">Clone</button>
  <button id="btn-del" class="danger">Delete</button>
  <label>Name</label>
  <input type="text" id="lname">
  <div id="mode-btns">
    <button id="btn-tiles" class="active">Tiles</button>
    <button id="btn-robots">Robots</button>
  </div>
  <label><input type="checkbox" id="show-grid"> Grid</label>
  <label id="btn-imp-wrap" class="export" style="margin-left:auto;padding:3px 8px;border:1px solid #004a6a;border-radius:3px;cursor:pointer;background:#002a4a;color:#adf">Import JSON<input type="file" id="btn-imp" accept=".json" style="display:none"></label>
  <button id="btn-expj" class="export">Export JSON</button>
  <button id="btn-exp" class="export">Export .c</button>
</div>
<div id="main">
  <div id="left-panel">

    <!-- TILE UI -->
    <div id="tile-ui">
      <div id="palette-section">
        <h3>Tile Palette — click=select, dblclick=edit</h3>
        <div id="tile-palette"></div>
      </div>
      <div id="tile-editor-section">
        <h3>Pixel Editor — <span id="etl" style="color:#fc0;font-size:10px"></span></h3>
        <div id="te-wrap">
          <div>
            <div id="pixel-grid"></div>
            <div class="ops">
              <button id="bsl">◀</button><button id="bsr">▶</button>
              <button id="bsu">▲</button><button id="bsd">▼</button>
              <button id="bfh">↔</button><button id="bfv">↕</button>
              <button id="bclr" class="danger">Clr</button>
            </div>
          </div>
          <div id="tile-props">
            <label>Type
              <select id="ttype">
                <option value="0">T_ITEM</option><option value="1">T_SWITCHOFF</option>
                <option value="2">T_SWITCHON</option><option value="3">T_SPACE</option>
                <option value="4">T_SOLID</option><option value="5">T_FLOOR</option>
                <option value="6">T_COLLAPSE</option><option value="7">T_CONVEYL</option>
                <option value="8">T_CONVEYR</option><option value="9">T_HARM</option>
                <option value="10">T_VOID</option>
              </select>
            </label>
            <label>Ink <select id="tink"></select></label>
            <label>Paper <select id="tpaper"></select></label>
            <label class="row"><input type="checkbox" id="tbright"> Bright</label>
            <label>Bytes<input type="text" id="thex" placeholder="0xff,0x00,..."></label>
          </div>
        </div>
      </div>
      <div id="help">
        <div>Left-drag: paint tile &nbsp; Right-drag: erase</div>
        <div>Tile 0=background &nbsp; Tile 1=conveyor</div>
      </div>
    </div>

    <!-- ROBOT UI -->
    <div id="robot-ui" style="display:none">
      <div id="robot-col">
      <div id="robot-list-section">
        <h3>Robots (max 8 per level)</h3>
        <div id="robot-list"></div>
        <div id="robot-add">
          <button id="btn-add-robot">+ Add Robot</button>
          <span style="font-size:11px;color:#555" id="robot-add-hint">then click level</span>
        </div>
      </div>
      <div id="robot-props-section">
        <h3>Robot Properties</h3>
        <div class="rp-grid" id="rp-form">
          <label>X (tile)<input type="number" id="rp-x" min="0" max="31"></label>
          <label>Y (tile)<input type="number" id="rp-y" min="0" max="15"></label>
          <label>Min (px)<input type="number" id="rp-min" min="0" max="255"></label>
          <label>Max (px)<input type="number" id="rp-max" min="0" max="255"></label>
          <label class="wide">Movement
            <select id="rp-move">
              <option value="0">Left (bounces R)</option>
              <option value="1">Right (bounces L)</option>
              <option value="2">Up (bounces Down)</option>
              <option value="3">Down (bounces Up)</option>
              <option value="4">Kong</option>
              <option value="5">Skylab</option>
              <option value="6">Fall</option>
              <option value="7">Eugene</option>
              <option value="8">Spg</option>
              <option value="9">None (static)</option>
            </select>
          </label>
          <label>Speed<input type="number" id="rp-speed" min="0" max="15"></label>
          <label>Ink
            <select id="rp-ink"></select>
          </label>
          <label>Nframes
            <select id="rp-nframes">
              <option value="3">3 (4 frames)</option>
              <option value="7">7 (8 frames)</option>
            </select>
          </label>
          <label>Init frame<input type="number" id="rp-frame" min="0" max="7"></label>
          <label class="row" style="grid-column:1/-1"><input type="checkbox" id="rp-spg"> SPG robot</label>
        </div>
      </div>
      <div id="sprite-selector">
        <h3>Sprite — <span id="cur-sprite-idx" style="color:#fc0;font-size:10px"></span></h3>
        <div id="sprite-grid"></div>
      </div>
      </div><!-- end robot-col -->
      <div id="portal-col">
        <h3>Portal</h3>
        <div style="display:flex;flex-direction:column;gap:6px;font-size:11px">
          <label style="display:flex;flex-direction:column;gap:2px;color:#999">X<input type="number" id="portal-x" min="0" max="31" style="width:60px;background:#2a2a2a;color:#eee;border:1px solid #444;padding:2px 4px;border-radius:2px;font-size:11px"></label>
          <label style="display:flex;flex-direction:column;gap:2px;color:#999">Y<input type="number" id="portal-y" min="0" max="15" style="width:60px;background:#2a2a2a;color:#eee;border:1px solid #444;padding:2px 4px;border-radius:2px;font-size:11px"></label>
          <button id="btn-move-portal">Move Portal</button>
          <span id="portal-hint" style="color:#555"></span>
        </div>
      </div>
    </div>

  </div>
  <div id="scroll-area">
    <div id="grid-container">
      <canvas id="lc"></canvas>
      <canvas id="rc"></canvas>
      <canvas id="oc"></canvas>
    </div>
  </div>
</div>
<div id="status">Ready</div>

// ── Colour helpers ──────────────────────────────────────────────
function ink(inf){const b=(inf.colour>>6)&1,i=inf.colour&7;return SC[i+(b?8:0)];}
function pap(inf){const b=(inf.colour>>6)&1,p=(inf.colour>>4)&7;return SC[p+(b?8:0)];}
// Items (T_ITEM, type===0) render as bright red in the editor regardless of info.colour
function itemInkN(n){return '#FF0000';}
function robotColour(r){return SC[r.ink&15];}

// ── Tile rendering ───────────────────────────────────────────────
function dtile(ctx,x,y,gfx,ic,pc,sc=2){
  ctx.fillStyle=pc;ctx.fillRect(x,y,8*sc,8*sc);
  ctx.fillStyle=ic;
  for(let r=0;r<8;r++){const b=gfx[r]||0;for(let c=0;c<8;c++)if(b&(0x80>>c))ctx.fillRect(x+c*sc,y+r*sc,sc,sc);}
}

// ── Robot sprite rendering ───────────────────────────────────────
// sprite: frame array, each frame = array of 16 u16 rows
// Each u16: bit15=leftmost pixel, bit0=rightmost
function drawRobotSprite(ctx,x,y,sprIdx,frame,col,sc=1){
  if(sprIdx<0||sprIdx>=spritesData.length)return;
  const frames=spritesData[sprIdx];
  const rows=frames[frame%frames.length];
  ctx.fillStyle=col;
  for(let r=0;r<16;r++){
    const v=rows[r]||0;
    for(let c=0;c<16;c++)if(v&(0x8000>>c))ctx.fillRect(x+c*sc,y+r*sc,sc,sc);
  }
}

// Draw sprite into a small canvas (for thumbnail)
function spriteThumb(cnv,sprIdx,col,sc=1){
  const ctx=cnv.getContext('2d');
  ctx.clearRect(0,0,cnv.width,cnv.height);
  drawRobotSprite(ctx,0,0,sprIdx,0,col,sc);
}

// ── Level canvas ─────────────────────────────────────────────────
function renderAll(){
  const L=levels[cl];
  lc.width=GW*CS;lc.height=GH*CS;
  rc.width=GW*CS;rc.height=GH*CS;
  oc.width=GW*CS;oc.height=GH*CS;
  let ni=0;
  for(let i=0;i<512;i++){
    const col=i%GW,row=Math.floor(i/GW),t=L.data[i];
    const inf=L.info[t]||L.info[0];
    const ic=inf.type===0?itemInkN(ni++):ink(inf);
    const pc=inf.type===0?SC[0]:pap(inf);
    dtile(lx,col*CS,row*CS,L.gfx[t]||L.gfx[0],ic,pc);
  }
  renderRobots();
  renderOv();
}

function renderCell(i){
  const L=levels[cl],col=i%GW,row=Math.floor(i/GW),t=L.data[i];
  const inf=L.info[t]||L.info[0];
  let ic,pc;
  if(inf.type===0){let ni=0;for(let j=0;j<i;j++)if((L.info[L.data[j]]||L.info[0]).type===0)ni++;ic=itemInkN(ni);pc=SC[0];}
  else{ic=ink(inf);pc=pap(inf);}
  dtile(lx,col*CS,row*CS,L.gfx[t]||L.gfx[0],ic,pc);
}

function renderRobots(){
  rx.clearRect(0,0,rc.width,rc.height);
  const rs=robots[cl]||[];
  rs.forEach((r,i)=>{
    if(!r)return;
    const x=r.x*CS,y=r.y*CS;
    const col=robotColour(r);
    // Draw sprite
    drawRobotSprite(rx,x,y,r.gfx,r.frame%Math.max(1,r.nframes+1),col,1);
    // Selection highlight
    if(i===curRobot&&mode==='robots'){
      rx.strokeStyle='#fc0';rx.lineWidth=1.5;
      rx.strokeRect(x+0.5,y+0.5,15,15);
    }
    // Movement direction arrow
    const cx=x+8,cy=y+8;
    rx.fillStyle='rgba(255,255,255,0.6)';rx.font='8px monospace';rx.textAlign='center';rx.textBaseline='middle';
    const arrows=['←','→','↑','↓','K','S','F','E','P','·'];
    rx.fillText(arrows[r.move]||'·',cx,cy);
  });
  // Draw portal
  const pd=(portalsOverride||portalData)[cl];
  if(pd){
    const px=pd.x*CS,py=pd.y*CS,sc=CS/8;
    const ic=SC[pd.colour[0]&15]||'#fff';
    const pc=SC[pd.colour[1]&15]||'#000';
    rx.fillStyle=pc;rx.fillRect(px,py,16*sc,16*sc);
    rx.fillStyle=ic;
    for(let r=0;r<16;r++){const v=pd.gfx[r]||0;for(let c=0;c<16;c++)if(v&(0x8000>>c))rx.fillRect(px+c*sc,py+r*sc,sc,sc);}
    rx.strokeStyle='#0f0';rx.lineWidth=1;rx.strokeRect(px+0.5,py+0.5,16*sc-1,16*sc-1);
    rx.fillStyle='#0f0';rx.font='7px monospace';rx.textAlign='left';rx.textBaseline='top';
    rx.fillText('P',px+1,py+1);
  }
}

function renderOv(){
  ox.clearRect(0,0,oc.width,oc.height);
  if(!sg)return;
  ox.strokeStyle='rgba(255,255,255,0.1)';ox.lineWidth=0.5;
  for(let c=0;c<=GW;c++){ox.beginPath();ox.moveTo(c*CS,0);ox.lineTo(c*CS,GH*CS);ox.stroke();}
  for(let r=0;r<=GH;r++){ox.beginPath();ox.moveTo(0,r*CS);ox.lineTo(GW*CS,r*CS);ox.stroke();}
}

    const div=document.createElement('div');div.className='palette-tile'+(t===ct?' selected':'');
    const cv=document.createElement('canvas');cv.width=8;cv.height=8;
    const ti=L.info[t];const tic=ti.type===0?itemInkN(t):ink(ti);const tpc=ti.type===0?SC[0]:pap(ti);
    dtile(cv.getContext('2d'),0,0,L.gfx[t],tic,tpc,1);
    const lb=document.createElement('div');lb.className='tl';
    lb.textContent=t+':'+(TN[L.info[t].type]||'').replace('T_','').substring(0,5);
    div.appendChild(cv);div.appendChild(lb);
    div.addEventListener('click',()=>{ct=t;et=t;renderPalette();renderTE();});
    div.addEventListener('dblclick',()=>{et=t;renderTE();});
    c.appendChild(div);
  }
}

function buildPG(){
  const g=document.getElementById('pixel-grid');g.innerHTML='';
  for(let r=0;r<8;r++)for(let c=0;c<8;c++){
    const cell=document.createElement('div');cell.className='px';
    cell.dataset.r=r;cell.dataset.c=c;
    cell.addEventListener('mousedown',e=>{
      pd=true;const cur=(levels[cl].gfx[et][r]&(0x80>>c))?1:0;
      pm=!cur;setPx(r,c,pm);e.preventDefault();
    });
    cell.addEventListener('mouseover',()=>{if(pd)setPx(r,c,pm);});
    g.appendChild(cell);
  }
  document.addEventListener('mouseup',()=>pd=false);
}

function setPx(r,c,v){
  const g=levels[cl].gfx[et];
  if(v)g[r]|=(0x80>>c);else g[r]&=~(0x80>>c);
  renderTE();renderAll();renderPalette();
}

function renderTE(){
  const L=levels[cl],inf=L.info[et],gfx=L.gfx[et];
  const ic=inf.type===0?itemInkN(et):ink(inf);
  const pc=inf.type===0?SC[0]:pap(inf);
  document.getElementById('etl').textContent='Tile '+et;
  document.querySelectorAll('.px').forEach(cell=>{
    const r=+cell.dataset.r,c=+cell.dataset.c;
    cell.style.background=((gfx[r]||0)&(0x80>>c))?ic:pc;
  });
  document.getElementById('ttype').value=inf.type;
  document.getElementById('tink').value=inf.colour&7;
  document.getElementById('tpaper').value=(inf.colour>>4)&7;
  document.getElementById('tbright').checked=!!((inf.colour>>6)&1);
  document.getElementById('thex').value=gfx.map(v=>'0x'+v.toString(16).padStart(2,'0')).join(',');
}

function buildCS(){
  const ns=['Black','Blue','Red','Magenta','Green','Cyan','Yellow','White'];
  ['tink','tpaper','rp-ink'].forEach(id=>{
    const s=document.getElementById(id);s.innerHTML='';
    for(let i=0;i<8;i++){const o=document.createElement('option');o.value=i;o.textContent=i+' '+ns[i];s.appendChild(o);}
  });
}

function syncTileProps(){
  const inf=levels[cl].info[et];
  inf.type=+document.getElementById('ttype').value;
  const i=+document.getElementById('tink').value,p=+document.getElementById('tpaper').value;
  const b=document.getElementById('tbright').checked?1:0;
  inf.colour=(b<<6)|(p<<4)|i;
  renderTE();renderPalette();renderAll();
}

function applyHex(){
  const raw=document.getElementById('thex').value;
  const vals=raw.split(',').map(s=>parseInt(s.trim(),s.trim().startsWith('0x')?16:10));
  if(vals.length===8&&vals.every(v=>!isNaN(v)&&v>=0&&v<=255)){
    levels[cl].gfx[et]=vals;renderTE();renderAll();renderPalette();
  }
}

function gfxOp(op){
  const g=levels[cl].gfx[et];
  if(op==='l')for(let r=0;r<8;r++)g[r]=((g[r]<<1)|(g[r]>>7))&0xff;
  else if(op==='r')for(let r=0;r<8;r++)g[r]=((g[r]>>1)|(g[r]<<7))&0xff;
  else if(op==='u'){const t=g[0];for(let r=0;r<7;r++)g[r]=g[r+1];g[7]=t;}
  else if(op==='d'){const t=g[7];for(let r=7;r>0;r--)g[r]=g[r-1];g[0]=t;}
  else if(op==='fh')for(let r=0;r<8;r++){let b=g[r],f=0;for(let c=0;c<8;c++)if(b&(1<<c))f|=(1<<(7-c));g[r]=f;}
  else if(op==='fv')for(let r=0;r<4;r++){const t=g[r];g[r]=g[7-r];g[7-r]=t;}
  else if(op==='clr')for(let r=0;r<8;r++)g[r]=0;
  renderTE();renderAll();renderPalette();
}

// ── Robot panel ──────────────────────────────────────────────────
function defaultRobot(x,y){
  return {x,y,min:x*8,max:x*8+64,move:1,draw:10,spg:9,speed:0,gfx:0,ink:6,nframes:7,frame:0,tile:0};
}

function renderRobotList(){
  const list=document.getElementById('robot-list');list.innerHTML='';
  const rs=robots[cl]||[];
  let count=0;
  rs.forEach((r,i)=>{
    if(!r)return; count++;
    const div=document.createElement('div');
    div.className='robot-item'+(i===curRobot?' selected':'');
    // Mini sprite preview
    const cv=document.createElement('canvas');cv.className='ri-sprite';cv.width=16;cv.height=16;
    spriteThumb(cv,r.gfx,SC[r.ink&15]);
    const info=document.createElement('div');info.className='ri-info';
    info.textContent=`#${i} (${r.x},${r.y}) ${MN[r.move]||'?'} spd=${r.speed}`;
    const del=document.createElement('span');del.className='ri-del';del.textContent='×';
    del.addEventListener('click',e=>{e.stopPropagation();deleteRobot(i);});
    div.appendChild(cv);div.appendChild(info);div.appendChild(del);
    div.addEventListener('click',()=>{curRobot=i;renderRobotList();renderRobotProps();renderRobots();});
    list.appendChild(div);
  });
  if(count===0){
    const d=document.createElement('div');d.style.cssText='color:#444;font-size:11px;padding:4px';
    d.textContent='No robots on this level';list.appendChild(d);
  }
}

function renderRobotProps(){
  if(curRobot<0||!robots[cl]||!robots[cl][curRobot])return;
  const r=robots[cl][curRobot];
  document.getElementById('rp-x').value=r.x;
  document.getElementById('rp-y').value=r.y;
  document.getElementById('rp-min').value=r.min;
  document.getElementById('rp-max').value=r.max;
  document.getElementById('rp-move').value=r.move;
  document.getElementById('rp-speed').value=r.speed;
  document.getElementById('rp-ink').value=r.ink&7;
  document.getElementById('rp-nframes').value=r.nframes;
  document.getElementById('rp-frame').value=r.frame;
  document.getElementById('rp-spg').checked=(r.spg===8);
  document.getElementById('cur-sprite-idx').textContent='Sprite '+r.gfx;
  // Highlight selected sprite
  document.querySelectorAll('.sprite-thumb').forEach(el=>{
    el.classList.toggle('selected',+el.dataset.idx===r.gfx);
  });
}

function syncRobotProps(){
  if(curRobot<0||!robots[cl]||!robots[cl][curRobot])return;
  const r=robots[cl][curRobot];
  r.x=+document.getElementById('rp-x').value;
  r.y=+document.getElementById('rp-y').value;
  r.min=+document.getElementById('rp-min').value;
  r.max=+document.getElementById('rp-max').value;
  r.move=+document.getElementById('rp-move').value;
  r.speed=+document.getElementById('rp-speed').value;
  const ink2=+document.getElementById('rp-ink').value;
  const wasBright=(r.ink>7);
  r.ink=ink2|(wasBright?8:0);
  r.nframes=+document.getElementById('rp-nframes').value;
  r.frame=+document.getElementById('rp-frame').value;
  r.spg=document.getElementById('rp-spg').checked?8:9;
  r.draw=10;r.tile=0;
  renderRobotList();renderRobots();
}

function buildSpriteGrid(){
  const g=document.getElementById('sprite-grid');g.innerHTML='';
  for(let i=0;i<spritesData.length;i++){
    const div=document.createElement('div');div.className='sprite-thumb';div.dataset.idx=i;
    const cv=document.createElement('canvas');cv.width=16;cv.height=16;
    spriteThumb(cv,i,'#00ff00');
    const lb=document.createElement('div');lb.className='si';lb.textContent=i;
    div.appendChild(cv);div.appendChild(lb);
    div.addEventListener('click',()=>{
      if(curRobot>=0&&robots[cl]&&robots[cl][curRobot]){
        robots[cl][curRobot].gfx=i;
        renderRobotProps();renderRobots();renderRobotList();
      }
    });
    g.appendChild(div);
  }
}

function deleteRobot(i){
  if(!robots[cl])return;
  robots[cl][i]=null;
  if(curRobot===i)curRobot=-1;
  renderRobotList();renderRobots();
}

function addRobotAt(x,y){
  const rs=robots[cl]=robots[cl]||Array(8).fill(null);
  const slot=rs.findIndex(r=>r===null);
  if(slot<0){st.textContent='Max 8 robots per level';addRobotPending=false;return;}
  rs[slot]=defaultRobot(x,y);
  curRobot=slot;
  addRobotPending=false;
  document.getElementById('robot-add-hint').textContent='then click level';
  renderRobotList();renderRobotProps();renderRobots();
}

// ── Canvas interaction ───────────────────────────────────────────
function cellAt(e){
  const r=lc.getBoundingClientRect();
  const col=Math.floor((e.clientX-r.left)/CS),row=Math.floor((e.clientY-r.top)/CS);
  return(col<0||col>=GW||row<0||row>=GH)?null:{col,row,idx:row*GW+col};
}

function robotAt(col,row){
  const rs=robots[cl]||[];
  return rs.findIndex(r=>r&&r.x===col&&r.y===row);
}

rc.addEventListener('mousedown',e=>{
  e.preventDefault();
  const pos=cellAt(e);if(!pos)return;
  if(mode==='tiles'){
    md=true;mb=e.button;
    const t=mb===2?0:ct;levels[cl].data[pos.idx]=t;renderCell(pos.idx);
  } else {
    if(movePortalPending){
      ensurePortalsOverride();
      portalsOverride[cl].x=pos.col;portalsOverride[cl].y=pos.row;
      movePortalPending=false;
      document.getElementById('portal-hint').textContent='';
      updatePortalInputs();renderRobots();
    } else if(addRobotPending){
      addRobotAt(pos.col,pos.row);
    } else {
      const ri=robotAt(pos.col,pos.row);
      if(ri>=0){
        curRobot=ri;renderRobotList();renderRobotProps();renderRobots();
      } else if(e.button===2){
        // right-click empty = nothing
      } else {
        curRobot=-1;renderRobotList();renderRobots();
      }
    }
  }
});

rc.addEventListener('mousemove',e=>{
  if(mode==='tiles'&&md){
    const pos=cellAt(e);if(!pos)return;
    const t=mb===2?0:ct;levels[cl].data[pos.idx]=t;renderCell(pos.idx);
  }
  const pos=cellAt(e);
  if(pos){
    const ri=robotAt(pos.col,pos.row);
    let tip=`(${pos.col},${pos.row}) tile=${levels[cl].data[pos.idx]}`;
    if(ri>=0){const r=robots[cl][ri];tip+=`  Robot#${ri} ${MN[r.move]} gfx=${r.gfx}`;}
    st.textContent=tip;
  }
});
rc.addEventListener('mouseup',()=>md=false);
rc.addEventListener('contextmenu',e=>e.preventDefault());

// ── Level management ─────────────────────────────────────────────
function buildLS(){
  const s=document.getElementById('lsel');
  const pv=+s.value||0;s.innerHTML='';
  levels.forEach((L,i)=>{const o=document.createElement('option');o.value=i;o.textContent=String(i).padStart(2,'0')+': '+L.name;s.appendChild(o);});
  s.value=Math.min(pv,levels.length-1);
}

function loadLv(idx){
  cl=idx;ct=0;et=0;curRobot=-1;
  document.getElementById('lname').value=levels[idx].name;
  buildLS();document.getElementById('lsel').value=idx;
  renderAll();renderPalette();renderTE();
  if(mode==='robots'){renderRobotList();updatePortalInputs();}
  st.textContent='Level '+idx+': '+levels[idx].name;
}

// ── Mode switching ───────────────────────────────────────────────
function setMode(m){
  mode=m;
  document.getElementById('tile-ui').style.display=m==='tiles'?'flex':'none';
  document.getElementById('robot-ui').style.display=m==='robots'?'flex':'none';
  document.getElementById('btn-tiles').classList.toggle('active',m==='tiles');
  document.getElementById('btn-robots').classList.toggle('active',m==='robots');
  rc.style.cursor=m==='tiles'?'crosshair':'pointer';
  addRobotPending=false;movePortalPending=false;
  document.getElementById('portal-hint').textContent='';
  if(m==='robots'){renderRobotList();if(curRobot>=0)renderRobotProps();updatePortalInputs();}
  renderRobots();
}

// ── Toolbar wiring ───────────────────────────────────────────────
document.getElementById('lsel').addEventListener('change',e=>loadLv(+e.target.value));
document.getElementById('lname').addEventListener('input',e=>{levels[cl].name=e.target.value;buildLS();});
document.getElementById('show-grid').addEventListener('change',e=>{sg=e.target.checked;renderOv();});
document.getElementById('btn-tiles').addEventListener('click',()=>setMode('tiles'));
document.getElementById('btn-robots').addEventListener('click',()=>setMode('robots'));

document.getElementById('btn-new').addEventListener('click',()=>{
  const n=JSON.parse(JSON.stringify(levels[0]));
  n.name='New Level '+levels.length;n.data=Array(512).fill(0);
  for(let c=0;c<32;c++){n.data[c]=2;n.data[480+c]=2;}
  for(let r=0;r<16;r++){n.data[r*32]=2;n.data[r*32+31]=2;}
  levels.push(n);robots.push(Array(8).fill(null));loadLv(levels.length-1);
});
document.getElementById('btn-clone').addEventListener('click',()=>{
  const n=JSON.parse(JSON.stringify(levels[cl]));n.name=n.name+' (copy)';
  const nr=JSON.parse(JSON.stringify(robots[cl]||[]));
  levels.push(n);robots.push(nr);loadLv(levels.length-1);
});
document.getElementById('btn-del').addEventListener('click',()=>{
  if(levels.length<=1){alert('Cannot delete last level');return;}
  if(!confirm('Delete "'+levels[cl].name+'"?'))return;
  levels.splice(cl,1);robots.splice(cl,1);
  if(cl>=levels.length)cl=levels.length-1;loadLv(cl);
});

document.getElementById('btn-add-robot').addEventListener('click',()=>{
  const rs=robots[cl]||[];
  if(rs.filter(r=>r).length>=8){st.textContent='Max 8 robots per level';return;}
  addRobotPending=true;
  document.getElementById('robot-add-hint').textContent='← click on level';
  st.textContent='Click on the level to place the new robot';
});

document.getElementById('btn-move-portal').addEventListener('click',()=>{
  movePortalPending=true;addRobotPending=false;
  document.getElementById('portal-hint').textContent='← click on level';
  st.textContent='Click on the level to place the portal';
});
['portal-x','portal-y'].forEach(id=>document.getElementById(id).addEventListener('change',()=>{
  ensurePortalsOverride();
  const p=portalsOverride[cl];if(!p)return;
  p.x=+document.getElementById('portal-x').value;
  p.y=+document.getElementById('portal-y').value;
  renderRobots();
}));

['ttype','tink','tpaper','tbright'].forEach(id=>document.getElementById(id).addEventListener('change',syncTileProps));
document.getElementById('thex').addEventListener('change',applyHex);
document.getElementById('bsl').addEventListener('click',()=>gfxOp('l'));
document.getElementById('bsr').addEventListener('click',()=>gfxOp('r'));
document.getElementById('bsu').addEventListener('click',()=>gfxOp('u'));
document.getElementById('bsd').addEventListener('click',()=>gfxOp('d'));
document.getElementById('bfh').addEventListener('click',()=>gfxOp('fh'));
document.getElementById('bfv').addEventListener('click',()=>gfxOp('fv'));
document.getElementById('bclr').addEventListener('click',()=>gfxOp('clr'));

['rp-x','rp-y','rp-min','rp-max','rp-move','rp-speed','rp-ink','rp-nframes','rp-frame','rp-spg'].forEach(id=>
  document.getElementById(id).addEventListener('change',syncRobotProps));

// ── Export ───────────────────────────────────────────────────────
document.getElementById('btn-exp').addEventListener('click',()=>{
  const TM=['T_ITEM','T_SWITCHOFF','T_SWITCHON','T_SPACE','T_SOLID','T_FLOOR','T_COLLAPSE','T_CONVEYL','T_CONVEYR','T_HARM','T_VOID'];
  let out='/* Generated by Manic Miner Level + Robot Editor */\n\n';

  // levelData
  out+='#define SPACE   {0, 0, 0, 0, 0, 0, 0, 0}\n\n';
  out+='static LEVEL    levelData['+levels.length+'] =\n{\n';
  levels.forEach((L,li)=>{
    out+='    {\n';
    out+='        .name = "'+L.name.replace(/\\/g,'\\\\').replace(/"/g,'\\"')+'",\n';
    out+='        .data = {\n';
    for(let r=0;r<16;r++)out+='            '+L.data.slice(r*32,(r+1)*32).join(', ')+(r<15?',':'')+'\n';
    out+='        },\n        .gfx = {\n';
    L.gfx.forEach((g,gi)=>{
      out+='            '+(g.every(v=>v===0)?'SPACE':'{'+g.map(v=>String(v).padStart(3,' ')).join(', ')+'}');
      out+=(gi<9?',':'')+'\n';
    });
    out+='        },\n        .info = {\n';
    L.info.forEach((inf,ii)=>{
      out+='            {0x'+inf.colour.toString(16).padStart(2,'0')+', '+(TM[inf.type]||'T_SPACE')+'}';
      out+=(ii<9?',':'')+'\n';
    });
    out+='        }\n    }'+(li<levels.length-1?',':'')+'\n';
  });
  out+='}\n\n';

  // robotStart
  const nLevels=Math.max(robots.length,levels.length);
  out+='#define NOROBOT {0, 0, 0, 0, DoNothing, DoNothing, DoNothing, 0, 0, 0, 0, 0, 0}\n\n';
  out+='static ROBOT    robotStart['+nLevels+'][8] =\n{\n';
  for(let li=0;li<nLevels;li++){
    const rs=(robots[li]||[]).slice(0,8);
    while(rs.length<8)rs.push(null);
    out+='    {\n';
    rs.forEach((r,ri)=>{
      if(!r){out+='        NOROBOT';}
      else{
        const moveFn=MF[r.move]||'DoNothing';
        const spgFn=r.spg===8?'DoRobotSpg':'DoNothing';
        out+='        {'+r.x+', '+r.y+', '+r.min+', '+r.max+', '+moveFn+', DoRobotDraw, '+spgFn+', '+r.speed+', '+r.gfx+', 0x'+r.ink.toString(16)+', '+r.nframes+', '+r.frame+', 0}';
      }
      out+=(ri<7?',':'')+'\n';
    });
    out+='    }'+(li<nLevels-1?',':'')+'\n';
  }
  out+='}\n';

  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([out],{type:'text/plain'}));
  a.download='levels_robots_export.c';a.click();
  st.textContent='Exported '+levels.length+' levels + robot data';
});

// ── JSON Export ──────────────────────────────────────────────────
document.getElementById('btn-expj').addEventListener('click',()=>{
  const out={
    levels: levels.map(L=>({
      name: L.name,
      data: L.data,
      gfx:  L.gfx,
      info: L.info.map(inf=>({colour:inf.colour,type:inf.type})),
      air:    L.air    ?? 220,
      border: L.border ?? 0
    })),
    sprites: spritesData,
    robots: robots.map(rs=>{
      const sl=(rs||[]).slice(0,8);
      while(sl.length<8)sl.push(null);
      return sl.map(r=>r?{
        x:r.x,y:r.y,min:r.min,max:r.max,
        move:ETOR_MOVE[r.move]??0,
        speed:r.speed,gfx:r.gfx,ink:r.ink,
        nframes:r.nframes,frame:r.frame,
        spg:r.spg===8?1:0
      }:null);
    }),
    miner:  minersOverride  || minerData,
    portal: portalsOverride || portalData
  };
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([JSON.stringify(out,null,2)],{type:'application/json'}));
  a.download='levels.json';a.click();
  st.textContent='Exported levels.json ('+levels.length+' levels)';
});

// ── JSON Import ──────────────────────────────────────────────────
document.getElementById('btn-imp').addEventListener('change',e=>{
  const file=e.target.files[0];
  if(!file)return;
  const reader=new FileReader();
  reader.onload=ev=>{
    try{
      const d=JSON.parse(ev.target.result);
      if(d.levels){
        levels=d.levels.map(L=>({
          name: L.name||'',
          data: L.data||(new Array(512).fill(0)),
          gfx:  L.gfx||(new Array(10).fill([0,0,0,0,0,0,0,0])),
          info: (L.info||[]).map(inf=>({colour:inf.colour||0,type:inf.type??3})),
          air:    L.air    ?? 220,
          border: L.border ?? 0
        }));
      }
      if(d.robots){
        robots=d.robots.map(rs=>
          (rs||[]).map(r=>r?{
            x:r.x,y:r.y,min:r.min,max:r.max,
            move:JTOE_MOVE[r.move]??9,
            draw:10,spg:r.spg?8:9,
            speed:r.speed,gfx:r.gfx,ink:r.ink,
            nframes:r.nframes,frame:r.frame,tile:0
          }:null)
        );
      }
      if(d.miner)  minersOverride=d.miner;
      if(d.portal) portalsOverride=d.portal;
      buildLS();loadLv(0);
      st.textContent='Imported '+levels.length+' levels from '+file.name;
    }catch(err){st.textContent='Import error: '+err.message;}
  };
  reader.readAsText(file);
  e.target.value=''; // allow re-importing same file
});

// ── Init ─────────────────────────────────────────────────────────
function initEditor(){
  buildCS();buildPG();buildSpriteGrid();buildLS();
  rc.style.position='absolute';rc.style.top='0';rc.style.left='0';
  loadLv(0);
}
(async()=>{
  try{
    const r=await fetch('levels.json');
    if(!r.ok)throw new Error();
    const d=await r.json();
    if(d.levels){
      levels=d.levels.map(L=>({
        name: L.name||'',
        data: L.data||(new Array(512).fill(0)),
        gfx:  L.gfx||(new Array(10).fill([0,0,0,0,0,0,0,0])),
        info: (L.info||[]).map(inf=>({colour:inf.colour||0,type:inf.type??3}))
      }));
    }
    if(d.robots){
      robots=d.robots.map(rs=>(rs||[]).map(r=>r?{
        x:r.x,y:r.y,min:r.min,max:r.max,
        move:JTOE_MOVE[r.move]??9,
        draw:10,spg:r.spg?8:9,
        speed:r.speed,gfx:r.gfx,ink:r.ink,
        nframes:r.nframes,frame:r.frame,tile:0
      }:null));
    }
    if(d.miner)minersOverride=d.miner;
    if(d.portal)portalsOverride=d.portal;
    while(robots.length<levels.length)robots.push(Array(8).fill(null));
    st.textContent='Auto-loaded levels.json';
  }catch(e){}
  initEditor();
})();
